name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar desde cero
        run: javac -encoding UTF-8 -d out $(find src tests -name "*.java")
      - name: Pruebas (P1 a P8)
        run: java -cp out PruebasAlmacen
      - name: Demo del menú (flujo completo P8)
        run: java -cp out app.Main < docs/evidencias/entradas/E5_P8_flujo_completo.txt
